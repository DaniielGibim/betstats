name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prepare ephemeral SQLite schema
        run: npx prisma db push --skip-generate
      - name: Prepare isolated auth SQLite schema
        env:
          DATABASE_URL: file:./auth-test.sqlite
        run: npx prisma migrate deploy
      - name: Run synthetic DATA and auth tests
        env:
          DATA_TEST_CLIENT: "@prisma/client"
          DATA_TEST_DATABASE: "file:./ci.db"
          AUTH_TEST_CLIENT: "@prisma/client"
          AUTH_TEST_DATABASE_URL: "file:./auth-test.sqlite"
        run: npm test
      - name: Generate Next.js types
        run: npx next typegen
      - name: Type-check
        run: npx tsc --noEmit --incremental false
      - name: Lint source
        run: npx eslint src eslint.config.mjs next.config.ts postcss.config.mjs tailwind.config.ts
      - name: Build
        run: npm run build
